name: astrbot_plugin_qqrecord # 插件唯一识别名，以 astrbot_plugin_ 前缀开头
display_name: QQ Record # 用于展示的名字，可以是方便人类阅读的名字（需要版本 >= v4.5.0，低版本不会报错，请放心填写）
desc: 将QQ群消息以“内容【群昵称】”的形式简单记录在JSONI文件中,可通过调用命令 `/record [limit]`返回当前会话对应日志的最近 N 行，默认20行，支持1-200行 # 插件简短描述
version: v1.1 # 插件版本号。格式：v1.1.1 或者 v1.1
author: WLEzj # 作者
repo: https://github.com/WLEzj/astrbot_plugin_qqrecord # 插件的仓库地址
